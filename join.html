<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naga Baru — Gabung</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:16px/1.55 "Barlow",system-ui,sans-serif;color:var(--ink);background:#0d1030;transition:color .8s;overflow-x:hidden}
body.night{--ink:#f1ecda;--mute:#b3b0d6;--line:rgba(241,236,218,.2);--accent:#f7b928;--accent2:#f08a24;--wolf:#ff5c7a;--solid:#0f1840;--g1:rgba(255,255,255,.13);--g2:rgba(255,255,255,.04);--h1:#161a4a;--h2:#0f1238;--b:#090b26;--litop:1;--shadow:rgba(0,0,0,.45)}
body.day{--ink:#1b2142;--mute:#4a5580;--line:rgba(27,33,66,.22);--accent:#e8780f;--accent2:#f7b928;--wolf:#c2183f;--solid:#f6f3ec;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.48);--h1:#8fb3c9;--h2:#6f9a86;--b:#3b4a5a;--litop:0;--shadow:rgba(40,60,90,.25)}
.sky{position:fixed;inset:0;z-index:-4;transition:opacity 1.2s}
#skyN{background:linear-gradient(#050a1f 0%,#0d1a4a 55%,#1c2a63 100%)}
#skyN::before,#skyN::after{content:"";position:absolute;inset:0;background-repeat:no-repeat;animation:tw 5s ease-in-out infinite alternate}
#skyN::before{background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 70% 9%,#fff,transparent),radial-gradient(1.5px 1.5px at 86% 32%,#fff,transparent),radial-gradient(1px 1px at 28% 44%,#fff,transparent),radial-gradient(1px 1px at 5% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 48% 22%,#fff,transparent)}
#skyN::after{animation-duration:7s;animation-delay:-2s;background-image:radial-gradient(1px 1px at 38% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 38%,#fff,transparent),radial-gradient(1px 1px at 92% 52%,#fff,transparent),radial-gradient(1px 1px at 18% 34%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 62%,#fff,transparent),radial-gradient(1px 1px at 55% 56%,#fff,transparent)}
@keyframes tw{from{opacity:.3}to{opacity:1}}
#skyD{background:radial-gradient(ellipse 180px 46px at 20% 16%,rgba(255,255,255,.85),transparent),radial-gradient(ellipse 240px 56px at 78% 34%,rgba(255,255,255,.75),transparent),radial-gradient(ellipse 140px 36px at 55% 10%,rgba(255,255,255,.7),transparent),linear-gradient(#7fb6e2 0%,#cfe5ee 55%,#ffe2c2 100%)}
body.night #skyD,body.day #skyN{opacity:0}
#celestial{position:fixed;top:calc(8vh + env(safe-area-inset-top,0px));right:10vw;width:min(26vw,128px);aspect-ratio:1;z-index:-3;pointer-events:none}
.orb{position:absolute;inset:0;border-radius:50%;transition:transform 1.4s cubic-bezier(.5,0,.25,1),opacity 1s}
.moon{background:radial-gradient(circle at 30% 30%,#fffdf0,#ece5bd 55%,#c8bf8f);box-shadow:0 0 50px 14px rgba(255,244,200,.35),0 0 140px 50px rgba(160,170,255,.18)}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 36%,rgba(120,110,70,.28) 0 9%,transparent 10%),radial-gradient(circle at 38% 66%,rgba(120,110,70,.22) 0 12%,transparent 13%),radial-gradient(circle at 70% 72%,rgba(120,110,70,.2) 0 6%,transparent 7%)}
.sun{background:radial-gradient(circle,#fffbd0,#ffd35c 55%,#ff9f3d);box-shadow:0 0 60px 20px rgba(255,190,80,.55)}
.sun::before{content:"";position:absolute;inset:-55%;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,140,.5) 0 5deg,transparent 5deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 28%,transparent 68%);mask-image:radial-gradient(circle,#000 28%,transparent 68%);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
body.night .moon,body.day .sun{transition-delay:.5s}
body.night .sun,body.day .moon{transform:translateY(85vh);opacity:0;transition-delay:0s}
.fog{position:fixed;left:-30%;bottom:6vh;width:160%;height:26vh;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 30% 50% at 25% 55%,rgba(255,255,255,.16),transparent),radial-gradient(ellipse 28% 45% at 70% 45%,rgba(255,255,255,.12),transparent);animation:drift 50s ease-in-out infinite alternate}
body.day .fog{opacity:.5}
@keyframes drift{to{transform:translateX(18%)}}
#land{position:fixed;left:0;bottom:0;width:100%;height:clamp(150px,30vh,300px);z-index:-1;pointer-events:none}
#land .h1{fill:var(--h1);transition:fill 1.2s}#land .h2{fill:var(--h2);transition:fill 1.2s}#land .b{fill:var(--b);transition:fill 1.2s}
#land .lit{fill:#ffc861;opacity:var(--litop);transition:opacity 1.2s;animation:flick 4s ease-in-out infinite alternate}
@keyframes flick{from{filter:drop-shadow(0 0 5px #ffb347)}to{filter:drop-shadow(0 0 2px #ffb347)}}
main{max-width:580px;margin:0 auto;padding:18px 16px 120px;position:relative}
h2,h3{font-family:"Bebas Neue",Georgia,serif;margin:0 0 8px}
h2{font-size:1.7rem;line-height:1.2}
h3{font-size:1.35rem;color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.emb{flex:none;width:58px;height:58px;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 50%,transparent)}
.emb img{display:block;width:100%;height:100%;object-fit:cover}
h1{font:700 2.3rem/1 "Bebas Neue",Georgia,serif;margin:0;letter-spacing:.02em;background:linear-gradient(90deg,var(--accent),var(--ink) 65%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 35%,transparent))}
.brand small{display:block;letter-spacing:.38em;text-transform:uppercase;font-size:.68rem;color:var(--mute);font-weight:800;margin-top:3px}
#ph{display:inline-flex;align-items:center;gap:8px;padding:.35em .95em;border-radius:999px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));font-weight:800;font-size:.82rem;}
#ph:empty{display:none}
#ph::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.box{position:relative;background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px var(--shadow),inset 0 1px 0 rgba(255,255,255,.2)}
#scr>*{animation:rise .5s both}
#scr>*:nth-child(2){animation-delay:.07s}#scr>*:nth-child(3){animation-delay:.14s}#scr>*:nth-child(n+4){animation-delay:.2s}
#scr.st>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
p{margin:.2em 0 .8em}.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s,background .2s}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.go{border:0;border-radius:999px;padding:.7em 1.5em;font-weight:800;color:#1c1530;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.go:active:not(:disabled){transform:scale(.97)}
.big{width:100%;margin-top:20px;padding:.95em;font-size:1.05rem}
.ghost{background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:999px;padding:.5em 1.1em}
.ghost:hover{border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip,.opt{background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:999px;padding:.5em 1.1em}
.opt{display:block;margin:8px 0}
.chip:hover,.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip.on,.opt.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1c1530;border-color:transparent;font-weight:800;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.sp{margin-top:22px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;min-width:0;font:inherit;padding:.55em .9em;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));color:var(--ink)}
.x{width:42px;border:1px solid var(--line);border-radius:12px;background:none}
.x:hover{border-color:var(--wolf);color:var(--wolf)}
.rr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ri{display:flex;gap:12px;align-items:center;min-width:0}
.ri i{font-style:normal;font-size:1.5rem;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--line);flex:none}
.ri small{display:block;color:var(--mute);font-size:.76rem;line-height:1.3;margin-top:1px}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));font-size:1.25rem;line-height:1}
.step button:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.step output{min-width:2ch;text-align:center;font-weight:800;font-size:1.15rem}
.tg{display:flex;gap:12px;align-items:center;margin-top:12px;cursor:pointer}
.tg input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;cursor:pointer}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{transform:translateX(20px)}
#chk{margin:12px 0;font-weight:800;color:var(--mute)}
#chk.bad{color:var(--wolf)}
.board{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pl{display:inline-flex;align-items:center;gap:7px;padding:.2em .85em .2em .55em;border-radius:999px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));font-size:.86rem;font-weight:700;}
.pl::before{content:"";width:10px;height:10px;border-radius:50%;background:hsl(var(--h,40) 70% 60%);box-shadow:0 0 8px hsl(var(--h,40) 70% 60%)}
.pl.dead{opacity:.45;text-decoration:line-through}
.pl.dead::before{background:var(--mute);box-shadow:none}
.death{border-left:3px solid var(--wolf);padding:.4em .9em;background:linear-gradient(90deg,color-mix(in srgb,var(--wolf) 16%,transparent),transparent);border-radius:0 10px 10px 0}
.death b{color:var(--wolf)}
.ring{--p:100%;width:min(76vw,250px);aspect-ratio:1;margin:18px auto;padding:10px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--line) 0);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 30%,transparent)}
.ring.hot{background:conic-gradient(var(--wolf) var(--p),var(--line) 0);box-shadow:0 0 44px color-mix(in srgb,var(--wolf) 45%,transparent);animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(1.03)}}
.tm{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--solid);font:700 3.4rem/1.1 "Bebas Neue",serif;font-variant-numeric:tabular-nums;padding:12px}
.tm.hot{color:var(--wolf)}
.w{color:var(--wolf);font-weight:800}
.card{perspective:900px;width:220px;height:300px;margin:14px auto;background:none;border:0;padding:0;display:block;animation:float 4s ease-in-out infinite}
.card.flip{animation:none}
@keyframes float{50%{transform:translateY(-7px)}}
.card .in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-content:center;gap:8px;text-align:center;padding:18px}
.face.back{background:radial-gradient(circle at 50% 40%,#4a3a9a,#1a1745 70%);border:2px solid #ffc861;box-shadow:0 0 30px rgba(255,200,97,.35),inset 0 0 40px rgba(0,0,0,.5);font-size:3.6rem;color:#ffd98a}
.face.back::after{content:"";position:absolute;inset:10px;border:1px dashed rgba(255,200,97,.5);border-radius:13px}
.face.front{transform:rotateY(180deg);color:#fff;border:2px solid var(--rc);background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--rc) 40%,#10122e),#0b0d26 75%);box-shadow:0 0 36px color-mix(in srgb,var(--rc) 55%,transparent)}
.face.front b{color:var(--rc);font:700 1.6rem "Bebas Neue",serif}
.face .big2{font-size:3.4rem;filter:drop-shadow(0 0 14px var(--rc))}
.face small{font-size:.84rem;line-height:1.4;opacity:.92}
.r-wolf{--rc:#ff5c7a}.r-seer{--rc:#a78bfa}.r-doc{--rc:#4fd1a5}.r-hunter{--rc:#ff9a4d}.r-witch{--rc:#d28bff}.r-vill{--rc:#ffc861}.r-guard{--rc:#5aa9ff}.r-gate{--rc:#d4d4d8}.r-elder{--rc:#d9c48f}.r-traitor{--rc:#c05a8f}.r-mimic{--rc:#4dd2d8}.r-thief{--rc:#c8803c}.r-hush{--rc:#8c9bff}.r-judge{--rc:#f2e94e}.r-wseer{--rc:#ff3b6b}.r-jester{--rc:#ff7ad9}
.hero{display:flex;gap:16px;align-items:center;padding-bottom:16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.hero img{flex:none;width:104px;height:104px;border-radius:22px;background:#000;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 50%,transparent);animation:float 5s ease-in-out infinite}
.hero b{display:block;font:700 1.35rem/1.2 "Bebas Neue",serif;color:var(--accent)}
.hero small{display:block;color:var(--mute);font-weight:800;letter-spacing:.04em}
.hero em{display:block;margin-top:6px;font-size:.9rem}
.rh{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.med{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.5rem;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 55%,#fff 10%),color-mix(in srgb,var(--rc) 35%,#0b0d26) 70%);border:2px solid var(--rc);box-shadow:0 0 28px color-mix(in srgb,var(--rc) 60%,transparent);animation:float 4s ease-in-out infinite}
.rh h3{margin:0;color:var(--rc)}
.rh small{display:block;color:var(--mute);font-size:.8rem;line-height:1.3;margin-top:2px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.roles span{padding:.2em .8em;border-radius:999px;border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));font-weight:700;font-size:.9rem}
h1{background:linear-gradient(100deg,var(--accent) 20%,#fff3c4 40%,var(--accent2) 60%,var(--accent) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:gold 7s linear infinite}
@keyframes gold{to{background-position:-250% 0}}
.box::after{content:"";position:absolute;left:12%;right:12%;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.85}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:opacity 1.2s}
body.day #fx,body.day .ss{opacity:0}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe27a;box-shadow:0 0 10px 3px rgba(255,226,122,.7);opacity:0;animation:fly var(--d) ease-in-out var(--dl) infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}20%,80%{opacity:1}50%{transform:translate(var(--x),var(--y))}100%{opacity:0;transform:translate(calc(var(--x)*-.5),calc(var(--y)*1.4))}}
.cloud{position:fixed;left:-30vw;height:48px;border-radius:50px;background:rgba(255,255,255,.75);z-index:-3;opacity:0;transition:opacity 1.2s;animation:cl 100s linear infinite}
body.day .cloud{opacity:1}
@keyframes cl{to{transform:translateX(150vw)}}
.ss{position:fixed;top:10vh;left:15vw;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);z-index:-3;opacity:0;animation:ss 11s ease-in 3s infinite;transition:opacity 1s}
@keyframes ss{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}9%{opacity:0;transform:translate(320px,150px) rotate(25deg)}100%{opacity:0}}
#pc{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(circle at 50% 45%,transparent 15%,color-mix(in srgb,var(--solid) 88%,transparent) 85%)}
#pc.on{opacity:1}
.pc-in{text-align:center;transform:scale(.88);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
#pc.on .pc-in{transform:scale(1)}
.pc-ic{font-size:3.6rem;filter:drop-shadow(0 0 22px var(--accent))}
#pc h2{font-size:clamp(2.6rem,11vw,4.6rem);margin:6px 0;background:linear-gradient(90deg,var(--accent),#fff3c4,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
#pc p{margin:0;letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:.85rem;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.4)}
.rr,.row{position:relative}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) 70% 60%);box-shadow:0 0 10px hsl(var(--h) 70% 60%);align-self:center}
.vn{display:flex;align-items:center;gap:9px;font-weight:700}
.vb{position:absolute;left:0;right:0;bottom:-1px;height:3px}
.vb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent);transition:width .3s}
h3.sp{display:flex;align-items:center;gap:10px}
h3.sp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rr.r-wolf,.rr.r-seer,.rr.r-doc,.rr.r-guard,.rr.r-gate,.rr.r-elder,.rr.r-traitor,.rr.r-mimic,.rr.r-thief,.rr.r-hush,.rr.r-judge,.rr.r-jester,.rr.r-wseer,.rr.r-hunter,.rr.r-witch,.rr.r-vill{border-bottom-color:color-mix(in srgb,var(--rc) 35%,transparent)}
.rr .ri i{border-color:var(--rc,var(--line));box-shadow:0 0 14px color-mix(in srgb,var(--rc,transparent) 40%,transparent)}
.dist{display:flex;gap:3px;height:36px;border-radius:12px;overflow:hidden;margin:14px 0 4px;box-shadow:0 4px 16px var(--shadow)}
.dist span{display:grid;place-items:center;min-width:0;font-weight:800;font-size:.85rem;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 80%,#fff 8%),color-mix(in srgb,var(--rc) 55%,#0b0d26))}
.avbig{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font:700 2.5rem "Bebas Neue",serif;color:#fff;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 60% 58%),hsl(var(--h) 55% 28%));box-shadow:0 0 0 3px var(--line),0 0 34px hsl(var(--h) 75% 50%/.6);margin:4px 0 14px}
.face.front::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.26) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.endlogo{display:block;width:96px;height:96px;border-radius:22px;background:#000;margin:0 auto 12px;box-shadow:0 0 34px color-mix(in srgb,var(--accent) 55%,transparent)}
.ln{position:fixed;bottom:-10vh;z-index:40;pointer-events:none;font-style:normal;animation:up var(--d) ease-in var(--dl) both;filter:drop-shadow(0 0 10px rgba(255,190,80,.8))}
@keyframes up{from{transform:translateY(0) rotate(-6deg);opacity:0}10%{opacity:1}to{transform:translateY(-120vh) rotate(8deg);opacity:0}}
h1{white-space:nowrap;font-size:clamp(1.7rem,8vw,2.3rem)}
#ph{white-space:nowrap;max-width:48vw;overflow:hidden;text-overflow:ellipsis;display:block;background:color-mix(in srgb,var(--solid) 78%,transparent)}
#ph:empty{display:none}
#ph::before{display:inline-block;margin-right:8px;vertical-align:1px}

/* ===== v4 ===== */
/* 1. Efek kematian */
.dx{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,0);opacity:0;transition:opacity .35s,background .35s;cursor:pointer;overflow:hidden}

/* 3. Penghitungan suara */
.vr{display:grid;gap:12px;margin:16px 0}

/* 4. Kartu peran: tilt 3D, holo, ikon */
.card{touch-action:none}
.card .tilt{height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s linear}

/* 5. Tint per peran */
#tint{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .9s;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--tc,#fff) 50%,transparent),transparent 72%),radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--tc,#fff) 26%,transparent),transparent 62%)}

/* 6. Papan pemain: kartu potret */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-bottom:14px}
.board .pl{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;width:auto;height:82px;padding:6px 4px 5px;border:0;border-radius:3px 16px 3px 16px;color:#f4f4f5;background:linear-gradient(115deg,transparent 60%,rgba(255,255,255,.12) 60% 64%,transparent 64%),linear-gradient(160deg,hsl(var(--h) 46% 36%),hsl(var(--h) 42% 12%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.4);overflow:visible;text-decoration:none}

.pl .pr{position:absolute;left:4px;top:2px;font-style:normal;font-size:.9rem}
.board .pl.dead{background:linear-gradient(160deg,#2a2a30,#0c0c0f);color:#8a8a93;transform:rotate(-1.5deg);text-decoration:none}
.board .pl.dead::before{display:block;content:"";position:absolute;inset:0;width:auto;height:auto;margin:0;border-radius:inherit;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2066%2082'%20preserveAspectRatio='none'%3E%3Cpath%20d='M40%200%20L34%2018%20L42%2030%20L30%2046%20L38%2058%20L28%2082%20M34%2018%20L18%2026%20L12%2040%20M30%2046%20L48%2054%20L56%2070'%20fill='none'%20stroke='white'%20stroke-opacity='.75'%20stroke-width='1.3'%20stroke-linejoin='round'/%3E%3C/svg%3E") center/100% 100% no-repeat;opacity:.9;box-shadow:none;filter:none}
.pl.dead .pi{opacity:.5}
.pl.dead .pn{text-decoration:line-through}
.board .pl.new{animation:pnew .6s}

.cs{position:fixed;inset:0;z-index:88;display:grid;place-items:center;background:rgba(5,5,9,.985);opacity:0;transition:opacity .25s;cursor:pointer}
.cs.on{opacity:1}
.cs::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 62%)}
.cs-in{position:relative;text-align:center}
.cs-svg{width:min(62vw,240px);height:auto;overflow:visible;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--rc) 70%,transparent))}
.cs-t{margin-top:18px;font:400 clamp(1.4rem,6vw,2rem) "Bebas Neue",serif;letter-spacing:.2em;text-indent:.2em;color:#f1f1f4;animation:dxk .5s .5s both}
.cs-seer .lid{transform-origin:100px 100px;animation:eyeopen 1s .1s cubic-bezier(.2,.9,.2,1) both}
@keyframes eyeopen{from{transform:scaleY(.04)}}
.cs-seer .iris{transform-box:fill-box;transform-origin:center;animation:irisp 1.2s ease-in-out infinite alternate}
@keyframes irisp{to{transform:scale(1.18)}}
.cs-seer .rays{animation:fadein .4s .7s both}
.cs-doc .crs{transform-box:fill-box;transform-origin:center;animation:cpulse .8s .1s ease-in-out both}
@keyframes cpulse{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.25);opacity:1}75%{transform:scale(.94)}}
.cs-doc .rg2{transform-box:fill-box;transform-origin:center;animation:ringx 1.2s .2s ease-out both}
.cs-doc .rg2.r2{animation-delay:.6s}
@keyframes ringx{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.cs-witch[data-v=heal]{--rc:#4fd1a5}
.cs-witch[data-v=poison]{--rc:#d28bff}
.cs-witch[data-v=none]{--rc:#8a8a93}
.cs-witch .fl{transform-origin:110px 100px;transform:rotate(-40deg);animation:tilt .6s .1s ease-out both}
@keyframes tilt{from{transform:rotate(0)}}
.cs-witch .strm{stroke-dasharray:1;animation:draw .7s .5s ease-in both}
.cs-witch .glow{transform-box:fill-box;transform-origin:center;animation:splash 1s 1.0s ease-out both}
@keyframes splash{from{transform:scale(.2);opacity:0}40%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}}
.cs-hunter .xh{transform-box:fill-box;transform-origin:center;animation:xlock .9s .1s cubic-bezier(.2,.9,.2,1) both}
@keyframes xlock{from{transform:scale(3) rotate(90deg);opacity:0}}
.cs-hunter .dot{animation:blink .22s .9s 3}
@keyframes blink{50%{opacity:0}}
.cs-guard .shd{transform-box:fill-box;transform-origin:center;animation:shdin .6s .1s cubic-bezier(.2,.9,.2,1) both}
@keyframes shdin{from{transform:scale(2.2);opacity:0}}
.cs-gate .shk{animation:shkc .5s .2s ease-in both}
@keyframes shkc{from{transform:translateY(-24px)}}
.cs-elder .g,.cs-traitor .g,.cs-mimic .g,.cs-thief .g,.cs-hush .g,.cs-judge .g,.cs-jester .g,.cs-wseer .g{transform-box:fill-box;transform-origin:center;animation:shdin .6s .1s cubic-bezier(.2,.9,.2,1) both}
.cs-wolf .cl{stroke-dasharray:1;animation:draw .35s ease-out both}
.cs-wolf .c1{animation-delay:.1s}
.cs-wolf .c2{animation-delay:.24s}
.cs-wolf .c3{animation-delay:.38s}
.cs-vill .win{animation:winglow 1.1s .1s ease-in-out infinite alternate}
@keyframes winglow{from{opacity:.25}}

.dx.on{background:rgba(0,0,0,.975)}

/* ===== v6 ===== */
/* tema (variabel dasar) */
html{--ac:#ff2e4f;--m1:#ff7d7d;--m2:#d1102f;--m3:#5a0012;--em1:#ffd9a0;--em2:#ff5a2e;--pt1:#ffc2d1;--pt2:#ff8fab;--tm1:#fff3d0;--tm2:#e8d3a0;--tm3:#8d7a4a;--thm:transparent}
html[data-theme=salju]{--ac:#5cc8ff;--m1:#f2fbff;--m2:#8fd3f5;--m3:#1d4f78;--em1:#ffffff;--em2:#8fd6ff;--pt1:#ffffff;--pt2:#cfeaff;--tm1:#f2fbff;--tm2:#bfe3f7;--tm3:#5a8fb0;--thm:#3a8fd0}
html[data-theme=sakura]{--ac:#ff7fa3;--m1:#ffe0ea;--m2:#ff8fb0;--m3:#7a2a4a;--em1:#ffe6ef;--em2:#ff7fa3;--pt1:#ffd0de;--pt2:#ff7fa3;--tm1:#fff0f5;--tm2:#ffc2d4;--tm3:#a05a78;--thm:#e0527f}
html[data-theme=salju] body.night{--accent:#5cc8ff;--accent2:#9fe0ff;--wolf:#7fd3ff}
html[data-theme=salju] body.day{--accent:#1c7fbf;--accent2:#5cc8ff;--wolf:#176aa0}
html[data-theme=sakura] body.night{--accent:#ff7fa3;--accent2:#ffb3c7;--wolf:#ff8fb0}
html[data-theme=sakura] body.day{--accent:#d2386a;--accent2:#ff7fa3;--wolf:#b02a58}
html[data-theme=salju] .petal{border-radius:50%;box-shadow:0 0 4px rgba(90,160,210,.6)}
#thm{position:fixed;inset:0;z-index:-2;pointer-events:none;background:var(--thm);mix-blend-mode:color;opacity:.5;transition:background 1s}
.thm{display:flex;gap:8px;margin:8px 0 10px}
.thc{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.thc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thc .sw{width:16px;height:16px;border-radius:50%;flex:none}
.sw-darah{background:linear-gradient(135deg,#ff7d7d,#d1102f)}
.sw-salju{background:linear-gradient(135deg,#f2fbff,#5cc8ff)}
.sw-sakura{background:linear-gradient(135deg,#ffe0ea,#ff7fa3)}

/* 5. Meja bundar */
@property --T{syntax:"<length>";inherits:true;initial-value:250px}
.board.round{display:block;margin:2px auto 10px}
.tbl{--T:min(calc(100vw - 90px),250px);position:relative;width:var(--T);height:var(--T);margin:0 auto;transition:--T .4s ease}
body.priv .tbl{--T:96px}
.tbl .tf{position:absolute;left:50%;top:50%;width:60%;height:60%;margin:-30% 0 0 -30%;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--ac) 24%,#1b1014),#07070a 78%);box-shadow:inset 0 0 0 2px var(--line),inset 0 0 0 8px rgba(0,0,0,.45),0 0 34px color-mix(in srgb,var(--ac) 28%,transparent)}
body.day .tbl .tf{background:radial-gradient(circle at 40% 35%,#efe7d2,#cdbf9e 78%);box-shadow:inset 0 0 0 2px var(--line),inset 0 0 0 8px rgba(0,0,0,.12),0 0 24px rgba(0,0,0,.18)}
.tc{position:absolute;left:50%;top:50%;width:54%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:3px;text-align:center;line-height:1}
.tc small{font:700 calc(var(--T)*.045)/1 "Barlow",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.tc b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 calc(var(--T)*.1)/1.1 "Bebas Neue",serif;letter-spacing:.04em;color:var(--ink)}
body.day .tc b{color:#111}
body.priv .tc{display:none}
.seat{position:absolute;transform:translate(-50%,-50%);width:calc(var(--T)*var(--k)/100);height:calc(var(--T)*var(--k)/100);border-radius:50%;display:grid;place-items:center;color:#f4f4f5;background:linear-gradient(160deg,hsl(var(--h) 46% 38%),hsl(var(--h) 42% 12%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s}
.seat b{font:400 calc(var(--T)*var(--k)/100*.55)/1 "Bebas Neue",serif;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.seat em{position:absolute;left:-20%;top:-24%;font-style:normal;font-size:calc(var(--T)*var(--k)/100*.46)}
.seat.act{transform:translate(-50%,-50%) scale(1.2);z-index:2;box-shadow:0 0 0 3px var(--ac),0 0 22px 6px color-mix(in srgb,var(--ac) 65%,transparent);animation:actp 1.2s ease-in-out infinite alternate}
@keyframes actp{to{box-shadow:0 0 0 3px var(--ac),0 0 34px 11px color-mix(in srgb,var(--ac) 80%,transparent)}}
.seat.dead{background:#1d1d22;color:#80808a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.seat.dead b{opacity:.5}
.seat.dead::after{content:"死";position:absolute;right:-24%;bottom:-22%;display:grid;place-items:center;width:calc(var(--T)*var(--k)/100*.5);height:calc(var(--T)*var(--k)/100*.5);border-radius:50%;background:var(--ac);color:#fff;font:800 calc(var(--T)*var(--k)/100*.3)/1 "Naga Kanji","Noto Serif JP",serif}
.seat.new{animation:pnew .6s}

/* 7. Washi, tinta, hanko */
.boxw{position:relative;margin-bottom:36px}
.box::before{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='300'%20height='300'%3E%3Cfilter%20id='f'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.012%20.5'%20numOctaves='3'%20seed='4'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%201.6%20-.62'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url%28%23f%29'/%3E%3C/svg%3E") 0 0/300px;opacity:.09;mix-blend-mode:soft-light;z-index:1}
body.day .box::before{filter:invert(1);opacity:.07;mix-blend-mode:multiply}
#scr h2{position:relative;text-shadow:0 0 .6px currentColor,0 1px 2px rgba(0,0,0,.3)}
#scr h2::after{content:"";position:absolute;left:.3em;top:100%;width:3px;height:0;margin-top:-.12em;border-radius:0 0 3px 3px;background:var(--ac);opacity:.9;animation:drip 2.4s .9s cubic-bezier(.4,0,.6,1) both;pointer-events:none}
@keyframes drip{0%{height:0}55%{height:.6em}85%{height:.6em;opacity:.9}100%{height:.6em;opacity:0}}
.hanko{position:absolute;right:16px;bottom:-30px;z-index:3;width:46px;height:46px;display:grid;place-items:center;transform:rotate(-8deg);background:var(--ac);color:#fff;border-radius:5px 9px 6px 8px;font-style:normal;opacity:.92;pointer-events:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent),0 6px 14px rgba(0,0,0,.4)}

function parse(html){const d=document.createElement('div');d.innerHTML=html.split('@LOGO').join(LOGO);return d}
function attrs(a,b){
  for(const x of [...a.attributes])if(!b.hasAttribute(x.name))a.removeAttribute(x.name);
  for(const x of [...b.attributes])if(a.getAttribute(x.name)!==x.value)a.setAttribute(x.name,x.value);
}
function morph(a,b){attrs(a,b);kids(a,b)}
function kids(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  bc.forEach((y,i)=>{
    const x=ac[i];
    if(!x){a.appendChild(y.cloneNode(true));return}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);return}
    if(x.nodeType===3||x.nodeType===8){if(x.data!==y.data)x.data=y.data;return}
    morph(x,y);
  });
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}

function setMsg(html,cls){scr.className='box';scr.dataset.mode='ro';setHTML(scr,html);foot.hidden=true}
function beep(){try{const c=st.ac||(st.ac=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.4)}catch(e){}}
function cue(){try{navigator.vibrate&&navigator.vibrate([140,70,140])}catch(e){}beep()}
async function keepAwake(){try{if(navigator.wakeLock&&!document.hidden)st.wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();if(st.joined&&!(st.conn&&st.conn.open))connect()}});

/* ---------- layar awal ---------- */
function showJoin(msg){
  document.body.className='night';ph.textContent='Gabung';board.className='board';board.innerHTML='';foot.hidden=true;
  scr.className='box';scr.dataset.mode='own';
  scr.innerHTML=`<div class="hero2"><div class="lr"><img src="${LOGO}" alt=""></div><b>Karang Taruna Naga Baru</b><span class="jp">人狼</span></div>
  <h3>Gabung permainan</h3>
  ${CODE?`<p class="mute">Kode ruangan: <b class="mpcode">${esc(CODE)}</b></p>`:'<div id="chk" class="bad">Link tidak memuat kode ruangan. Minta link atau QR dari tuan rumah.</div>'}
  ${msg?`<div id="chk" class="bad">${esc(msg)}</div>`:''}
  <div class="mplink"><input id="jn" maxlength="12" placeholder="Nama kamu" value="${esc(st.name)}" autocomplete="off"></div>
  <button class="go big" id="jg" ${CODE?'':'disabled'}>Gabung</button>`;
  const go=()=>{const n=$('#jn').value.trim();if(!n){$('#jn').focus();return}st.name=n.slice(0,12);ls.set('nb-name',st.name);ls.set(SK,CODE);st.joined=true;st.stop=false;keepAwake();beep();connect()};
  $('#jg').onclick=go;$('#jn').onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ---------- koneksi ---------- */
let retryT=0;
function status(t){setMsg(`<div class="mpwait"><div class="mpw-ic">📡</div><h3>${esc(t)}</h3><p class="mute">Kode ruangan ${esc(CODE)}</p></div>`)}
function connect(){
  if(st.stop)return;clearTimeout(retryT);
  status(st.everWelcome?'Menghubungkan ulang…':'Menghubungkan…');
  const go=()=>{
    let c;
    try{c=st.peer.connect('nagabaru-'+CODE,{serialization:'json',reliable:true})}catch(e){return later()}
    st.conn=c;
    let opened=false;
    c.on('open',()=>{opened=true;st.lastPong=Date.now();c.send({t:'hello',name:st.name,token:TOK})});
    c.on('data',onMsg);
    c.on('close',()=>{if(st.conn===c)later()});
    c.on('error',()=>{if(st.conn===c)later()});
    setTimeout(()=>{if(!opened&&st.conn===c){try{c.close()}catch(e){}later()}},9000);
  };
  if(st.peer&&!st.peer.destroyed&&!st.peer.disconnected&&st.peer.open)return go();
  try{st.peer&&st.peer.destroy()}catch(e){}
  const p=new Peer(undefined,Object.assign({debug:0},peerOpts()));st.peer=p;
  p.on('open',go);
  p.on('error',e=>{if(st.peer===p&&!st.stop)later()});
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
}
function later(){if(st.stop)return;clearTimeout(retryT);retryT=setTimeout(connect,2500)}
setInterval(()=>{
  if(!st.joined||st.stop)return;
  if(st.conn&&st.conn.open){try{st.conn.send({t:'ping'})}catch(e){}if(Date.now()-st.lastPong>15000){try{st.conn.close()}catch(e){}later()}}
},4000);

/* ---------- pesan dari tuan rumah ---------- */
function onMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='pong'){st.lastPong=Date.now();return}
  st.lastPong=Date.now();
  if(m.t==='welcome'){st.everWelcome=true;st.name=m.name;ls.set('nb-name',m.name);return}
  if(m.t==='reject'){st.stop=true;st.joined=false;ls.del(SK);try{st.conn.close()}catch(e){}showJoin(m.why);return}
  if(m.k==='lobby'){
    document.body.className='night';ph.textContent='Lobi';board.className='board';board.innerHTML='';
    scr.className='box';scr.dataset.mode='ro';foot.hidden=true;st.mode='lobby';
    setHTML(scr,`<div class="hero2"><div class="lr"><img src="@LOGO" alt=""></div><b>Karang Taruna Naga Baru</b><span class="jp">人狼</span></div>
    <h3>Kamu sudah masuk 🎉</h3><p class="mute">Menunggu tuan rumah memulai permainan. Jangan tutup halaman ini.</p>
    <ul class="mpl">${m.players.map((x,i)=>`<li><i class="dot ${x.ok?'on':''}" style="--h:${i*47}"></i><b>${esc(x.n)}</b>${i===m.me?'<small>(kamu)</small>':''}${x.h?'<small>tuan rumah</small>':''}</li>`).join('')}</ul>`);
    return;
  }
  if(m.k==='view'){
    st.seq=m.seq;
    const was=st.mode;st.mode=m.mode;
    document.body.className=m.cls;
    document.documentElement.dataset.theme=m.theme;document.documentElement.dataset.lite=m.lite;
    ph.textContent=m.ph;
    if(board.className!==m.bc)board.className=m.bc;
    setHTML(board,m.bh);
    if(scr.className!==m.sc)scr.className=m.sc;
    scr.dataset.mode=m.mode;
    setHTML(scr,m.sh);
    foot.hidden=m.mode==='own'||m.mode==='wait';
    foot.textContent=m.mode==='ro'?'Menunggu tuan rumah melanjutkan…':'';
    if(m.mode==='own'&&was!=='own')cue();
  }
}

/* ---------- klik → tuan rumah ---------- */
scr.addEventListener('click',e=>{
  if(scr.dataset.mode!=='own'||!st.conn||!st.conn.open||!st.joined)return;
  let t=e.target;if(!(t instanceof Element)||t===scr)return;
  const path=[];let n=t;
  while(n&&n!==scr){const p=n.parentElement;if(!p)return;path.unshift([...p.children].indexOf(n));n=p}
  const sig=t.tagName+':'+(t.textContent||'').trim().slice(0,30);
  const d=t.closest('[data-mp]');
  try{st.conn.send({t:'click',seq:st.seq,path,sig,d:d?d.dataset.mp:null})}catch(_){}
});

/* ---------- mulai ---------- */
if(ls.get(SK)===CODE&&CODE&&st.name){st.joined=true;keepAwake();connect()}else showJoin();
})();

</script>
</body>
</html>
